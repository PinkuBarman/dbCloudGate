<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>dbCloudGate - Target Architecture (GCP)</title>
<style>
  :root{--bg:#f4f6fa;--panel:#fff;--ink:#202124;--grey:#5f6368;--blue:#1a73e8;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:14px 22px;background:#fff;border-bottom:1px solid #e4e7ec}
  header h1{margin:0;font-size:18px}
  header p{margin:4px 0 0;font-size:13px;color:var(--grey)}
  .wrap{max-width:1500px;margin:0 auto;padding:16px}
  .stage{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:10px;overflow:auto}
  .stage svg{width:100%;height:auto;display:block}
  .node{cursor:pointer}
  .node,.node rect:first-of-type{transition:opacity .28s, stroke .2s, stroke-width .2s}
  .node:hover rect:first-of-type{stroke:var(--blue);stroke-width:3.5}
  .stage.guiding .node{opacity:.14}
  .stage.guiding .node.spot{opacity:1}
  .node.spot rect:first-of-type{stroke:var(--blue);stroke-width:4}

  .bar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .bar .lbl{font-size:13px;font-weight:700;color:var(--grey);margin-right:2px}
  button{font-family:inherit;font-size:13px;border:1px solid #d3d8e0;background:#fff;color:var(--ink);
         border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--blue);color:var(--blue)}
  button:disabled{opacity:.4;cursor:default;color:var(--ink);border-color:#d3d8e0}
  button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .pill{font-size:12px;border:1px solid #d3d8e0;background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--grey)}
  .pill:hover{border-color:var(--blue);color:var(--blue)}
  .pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .pill .num{opacity:.7;margin-right:5px}
  #panel{margin-top:12px;background:var(--panel);border:1px solid #e4e7ec;border-left:5px solid var(--blue);
         border-radius:12px;padding:15px 18px;min-height:64px;font-size:15px;line-height:1.55}
  #panel .step{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
  #panel h3{margin:2px 0 6px;font-size:17px}
  #panel .hint{color:var(--grey);font-size:13.5px;font-weight:400}
  #panel .say{margin:0}
</style></head>

<script>
  var STEPS = [{"n": "Secure entry", "k": ["app-team-domain-lead", "identity-aware-proxy-iap", "cloud-identity-sso"], "s": "Everything starts with the app team or Domain Lead opening the web app. They can't reach it directly \u2014 Identity-Aware Proxy enforces corporate SSO through Cloud Identity first. Access is controlled before anyone touches the platform."}, {"n": "Serverless app", "k": ["cloud-run-spa-web-ui", "cloud-run-workflow-api", "cloud-workflows-gated-lifecycle", "pub-sub-async-events"], "s": "The UI and API run on Cloud Run \u2014 serverless, so it scales to zero when idle. Cloud Workflows is the conductor that enforces the gated lifecycle: assessment \u2192 demand \u2192 approval \u2192 design. Pub/Sub runs the slow work asynchronously so the user isn't left waiting."}, {"n": "Upload & parse", "k": ["cloud-storage-uploaded-docs", "document-ai-parse-pdf-docx-pptx"], "s": "The user uploads their architecture document; it lands in Cloud Storage. Document AI parses that PDF, DOCX or PPTX into structured text the model can actually reason over."}, {"n": "AI reasoning", "k": ["vertex-ai-gemini-claude", "model-garden-extraction-sdd-draft"], "s": "This is the core. Vertex AI \u2014 Gemini or Claude via Model Garden \u2014 extracts the current-state profile, maps it to target GCP services, scores migration readiness, and drafts the SDD sections."}, {"n": "Grounding (RAG)", "k": ["vertex-ai-search-rag-grounding", "bitbucket-adr-blueprints"], "s": "Before it writes anything, Vertex AI Search grounds the model on our approved ADRs and Blueprints held in Bitbucket and the Catalogue Page. This is what stops it inventing references \u2014 it can only cite real, approved decisions."}, {"n": "Facts & cost", "k": ["nar-waltz-app-register", "cloud-billing-pricing-finops"], "s": "It pulls authoritative application data from NAR / Waltz, and provisional cost estimates from Cloud Billing pricing \u2014 treated as provisional until real usage telemetry firms them up."}, {"n": "State & records", "k": ["firestore-workflow-state", "cloud-sql-relational-state"], "s": "Every request, gap, approval and change-request state is written to Firestore, with Cloud SQL for relational data \u2014 so the whole process is reproducible and auditable."}, {"n": "Human gate", "k": ["outlook-approval-email", "confluence-sdd-write-back", "jira-cr-epic-story"], "s": "The AI assists, it never decides. A human reviews and approves at each gate \u2014 nudged via Outlook. Only then does the platform write the SDD back into Confluence and raise the Change Request, epics and stories in Jira."}, {"n": "Security", "k": ["iam-access-control", "vpc-service-controls", "cloud-kms-cmek-keys", "cloud-dlp-pii-in-docs", "secret-manager-secrets", "cloud-audit-logs"], "s": "This band applies to every step above, not one. IAM controls who does what; VPC Service Controls draw a data perimeter; CMEK encrypts with our own keys; DLP scans documents for PII; Secret Manager holds credentials; Audit Logs make every action reproducible."}, {"n": "Delivery", "k": ["cloud-monitoring", "cloud-logging", "github-app-iac-repos", "github-actions-build-test-deploy", "jfrog-artifactory-artifacts-images", "terraform-config-controller-lz"], "s": "Finally, Monitoring and Logging give dashboards and the operational trail, and the platform ships as code: GitHub holds the repos, GitHub Actions builds and deploys, JFrog Artifactory stores artifacts, and Terraform provisions the app and the DEV Landing Zone."}];
  var stage=document.getElementById('stage'), panel=document.getElementById('panel');
  var pills=document.getElementById('pills'), count=document.getElementById('count');
  var prevB=document.getElementById('prev'), nextB=document.getElementById('next'), freeB=document.getElementById('free');
  var nodes=[].slice.call(document.querySelectorAll('.node'));
  var idx=-1;

  STEPS.forEach(function(st,i){
    var p=document.createElement('span'); p.className='pill';
    p.innerHTML='<span class="num">'+(i+1)+'</span>'+st.n;
    p.onclick=function(){go(i)}; pills.appendChild(p);
  });

  function clearSpot(){ nodes.forEach(function(n){n.classList.remove('spot')}); }
  function render(){
    var pillEls=pills.querySelectorAll('.pill');
    pillEls.forEach(function(p,i){p.classList.toggle('active', i===idx)});
    if(idx<0){
      stage.classList.remove('guiding'); clearSpot();
      panel.innerHTML='<span class="hint">Free explore - hover or tap any tile for what it does, or press <b>Next</b> to start the guided walkthrough.</span>';
      count.textContent=''; prevB.disabled=true; return;
    }
    var st=STEPS[idx];
    stage.classList.add('guiding'); clearSpot();
    st.k.forEach(function(key){
      nodes.forEach(function(n){ if(n.getAttribute('data-k')===key) n.classList.add('spot'); });
    });
    panel.innerHTML='<div class="step">Step '+(idx+1)+' of '+STEPS.length+' &middot; '+st.n+'</div>'+
                    '<p class="say">'+st.s+'</p>';
    count.textContent=(idx+1)+' / '+STEPS.length;
    prevB.disabled=(idx<=0);
    // scroll the first spotlighted tile into view within the stage
  }
  function go(i){ idx=Math.max(-1,Math.min(STEPS.length-1,i)); render(); }
  nextB.onclick=function(){ go(idx<0?0:idx+1); };
  prevB.onclick=function(){ go(idx-1); };
  freeB.onclick=function(){ go(-1); };
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){e.preventDefault();go(idx<0?0:idx+1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();go(idx<0?-1:idx-1);}
    else if(e.key==='Escape'){go(-1);}
  });
  render();
</script>
</body></html>
