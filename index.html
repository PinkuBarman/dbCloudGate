<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudGate — GCP Onboarding Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy-900:#0A1F3D;--navy-800:#12305A;--navy-700:#1B4079;
--blue-600:#1A5FB4;--blue-500:#2D7DD2;--blue-100:#DBEAFE;--blue-50:#EFF6FF;
--slate-900:#0F172A;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748B;
--slate-400:#94A3B8;--slate-300:#CBD5E1;--slate-200:#E2E8F0;--slate-100:#F1F5F9;--slate-50:#F8FAFC;
--red-700:#B91C1C;--red-100:#FEE2E2;--red-50:#FEF2F2;
--amber-700:#B45309;--amber-100:#FEF3C7;--amber-50:#FFFBEB;
--green-700:#15803D;--green-100:#DCFCE7;--green-50:#F0FDF4;
--sky-700:#0369A1;--sky-100:#E0F2FE;--purple-700:#6D28D9;--purple-100:#EDE9FE;
--fs:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;
--sh:0 1px 2px rgba(15,23,42,.06);--sh-md:0 4px 12px rgba(15,23,42,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fs);background:var(--slate-100);color:var(--slate-900);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
svg{display:block}
.appbar{background:var(--navy-900);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.ab-l{display:flex;align-items:center;gap:16px}.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--blue-500),var(--blue-600));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border-radius:4px}
.logo-text{font-weight:600;font-size:16.5px;letter-spacing:-.02em}
.logo-sub{font-size:12.5px;color:var(--slate-400);border-left:1px solid var(--navy-700);padding-left:16px}
.ab-r{display:flex;align-items:center;gap:18px;font-size:12.5px}
.env{font-family:var(--fm);font-size:10px;padding:3px 8px;background:var(--navy-700);border-radius:3px;letter-spacing:.06em;font-weight:600;color:var(--slate-300)}
.user{display:flex;align-items:center;gap:9px;color:var(--slate-300);padding:5px 8px}
.user-av{width:28px;height:28px;background:var(--blue-600);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff}
.stepper-wrap{background:#fff;border-bottom:1px solid var(--slate-200);position:sticky;top:56px;z-index:199;overflow-x:auto;box-shadow:var(--sh)}
.bands{display:flex;border-bottom:1px solid var(--slate-200);min-width:660px}
.ph{flex:1;padding:10px 8px;text-align:center;border-right:1px solid var(--slate-200);background:var(--slate-50);min-width:0;transition:.15s}
.ph:last-child{border-right:none}
.ph.clk{cursor:pointer}
.ph.clk:hover{filter:brightness(.97)}
.ph-ic{width:17px;height:17px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:9px;font-weight:700;background:var(--slate-200);color:var(--slate-400)}
.ph-n{font-family:var(--fm);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--slate-400);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-s{font-size:9px;color:var(--slate-300);margin-top:3px;font-family:var(--fm)}
.ph.done{background:var(--green-50)}
.ph.done .ph-ic{background:var(--green-700);color:#fff}
.ph.done .ph-n{color:var(--green-700)}
.ph.done .ph-s{color:#86EFAC}
.ph.cur{background:var(--blue-50);box-shadow:inset 0 -2.5px 0 var(--blue-600)}
.ph.cur .ph-ic{background:var(--blue-600);color:#fff;box-shadow:0 0 0 3px var(--blue-100)}
.ph.cur .ph-n{color:var(--navy-900);font-weight:700}
.ph.cur .ph-s{color:var(--blue-600);font-weight:600}
.ph.blk{background:var(--red-50);box-shadow:inset 0 -2.5px 0 var(--red-700)}
.ph.blk .ph-ic{background:var(--red-700);color:#fff;box-shadow:0 0 0 3px var(--red-100)}
.ph.blk .ph-n{color:var(--red-700);font-weight:700}
.ph.blk .ph-s{color:var(--red-700);font-weight:600}
.ph.oos{background:#FAFBFC}
.ph.oos .ph-n{color:var(--slate-300)}
.ph.oos .ph-ic{background:var(--slate-100);color:var(--slate-300)}
.ph.oos .ph-s{color:var(--slate-200)}
.stepper{display:flex;padding:0 6px;background:#fff}
.st{padding:11px 20px;display:flex;align-items:center;gap:9px;border-right:1px solid var(--slate-100);white-space:nowrap;transition:.15s}
.st:last-child{border-right:none}
.st.clk{cursor:pointer}
.st.clk:hover{background:var(--slate-50)}
.st-ic{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:9.5px;font-weight:700;background:var(--slate-200);color:var(--slate-500);flex-shrink:0}
.st-l{font-size:12.5px;color:var(--slate-400);font-weight:500}
.st.done .st-ic{background:var(--green-700);color:#fff}
.st.done .st-l{color:var(--slate-600)}
.st.cur .st-ic{background:var(--blue-600);color:#fff;box-shadow:0 0 0 3px var(--blue-100)}
.st.cur .st-l{color:var(--navy-900);font-weight:600}
.st.blk .st-ic{background:var(--red-700);color:#fff;box-shadow:0 0 0 3px var(--red-100)}
.st.blk .st-l{color:var(--red-700);font-weight:600}
.layout{display:grid;grid-template-columns:1fr 304px;max-width:1440px;margin:0 auto;align-items:start}
.main{padding:26px 32px 90px;min-width:0}
.rail{padding:24px 22px;border-left:1px solid var(--slate-200);background:#fff;min-height:calc(100vh - 100px);position:sticky;top:100px;display:flex;flex-direction:column}
.ph{margin-bottom:22px}.crumb{font-family:var(--fm);font-size:11px;color:var(--slate-500);margin-bottom:7px;letter-spacing:.04em}
.pt{font-size:25px;font-weight:600;color:var(--navy-900);letter-spacing:-.025em;margin-bottom:6px}
.pd{color:var(--slate-600);font-size:14px;max-width:690px}
.card{background:#fff;border:1px solid var(--slate-200);border-radius:6px;margin-bottom:16px;box-shadow:var(--sh);overflow:hidden}
.ch{padding:13px 20px;border-bottom:1px solid var(--slate-200);display:flex;justify-content:space-between;align-items:center;background:var(--slate-50);gap:12px}
.ct{font-size:13.5px;font-weight:600;color:var(--navy-900);display:flex;align-items:center;gap:8px}
.cm{font-family:var(--fm);font-size:11px;color:var(--slate-500);white-space:nowrap}
.cb{padding:20px}.cb.flush{padding:0}
.mini-tabs{display:inline-flex;border:1px solid var(--slate-300);border-radius:5px;overflow:hidden;margin-bottom:14px}
.mini-tab{padding:7px 14px;font-size:12.5px;font-weight:500;color:var(--slate-600);cursor:pointer;background:#fff;border:none;font-family:var(--fs);display:flex;align-items:center;gap:6px;border-right:1px solid var(--slate-300);transition:.15s}
.mini-tab:last-child{border-right:none}
.mini-tab.on{background:var(--navy-900);color:#fff}
.mini-tab:not(.on):hover{background:var(--slate-50)}
.sec-h{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate-500);font-weight:600;margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--slate-200)}
.sec-h:first-of-type{margin-top:4px}
.qblk .dz{padding:26px 22px}
.tabs{display:flex;border-bottom:1px solid var(--slate-200);background:var(--slate-50);padding:0 20px;gap:2px}
.tab{padding:11px 18px;font-size:13.5px;font-weight:500;color:var(--slate-500);cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--slate-700)}.tab.on{color:var(--blue-600);border-bottom-color:var(--blue-600);font-weight:600;background:#fff}
.qblk{padding:20px;border-bottom:1px solid var(--slate-100);opacity:.4;pointer-events:none;transition:.3s}
.qblk.act{opacity:1;pointer-events:auto}.qblk.ans{opacity:1;pointer-events:auto;background:var(--slate-50)}
.qblk:last-child{border-bottom:none}
.qnum{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--slate-200);color:var(--slate-600);font-family:var(--fm);font-size:10.5px;font-weight:700;align-items:center;justify-content:center;margin-right:10px}
.qblk.act .qnum{background:var(--blue-600);color:#fff}.qblk.ans .qnum{background:var(--green-700);color:#fff}
.qt{font-size:14.5px;font-weight:600;color:var(--navy-900);margin-bottom:5px;display:flex;align-items:center}
.qd{font-size:12.5px;color:var(--slate-500);margin-bottom:14px;margin-left:32px}
.qbody{margin-left:32px}
.lookup{display:grid;grid-template-columns:220px auto 1fr;gap:9px;align-items:center}
.inp{padding:10px 13px;border:1px solid var(--slate-300);border-radius:5px;font-family:var(--fs);font-size:13.5px;outline:none;transition:.15s;width:100%}
.inp:focus{border-color:var(--blue-600);box-shadow:0 0 0 3px var(--blue-100)}
.inp.mono{font-family:var(--fm)}
.hintrow{margin-top:9px;font-size:12px;color:var(--slate-500);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{padding:3px 9px;background:var(--slate-100);border:1px solid var(--slate-200);border-radius:12px;font-family:var(--fm);font-size:11px;color:var(--slate-600);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--blue-600);color:var(--blue-600);background:var(--blue-50)}
.resolved{margin-top:13px;padding:13px 16px;background:var(--green-50);border:1px solid #86EFAC;border-radius:5px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;animation:sl .25s ease}
.rtick{width:26px;height:26px;border-radius:50%;background:var(--green-700);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.rname{font-size:15px;font-weight:600;color:var(--navy-900)}
.rmeta{font-size:12.5px;color:var(--slate-600);margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:1.5px solid var(--slate-200);border-radius:6px;padding:14px;cursor:pointer;transition:.15s;background:#fff}
.opt:hover{border-color:var(--slate-400);box-shadow:var(--sh)}
.opt.on{border-color:var(--blue-600);background:var(--blue-50);box-shadow:0 0 0 3px var(--blue-100)}
.optn{font-size:14px;font-weight:600;color:var(--navy-900);margin-bottom:4px;display:flex;align-items:center;gap:7px}
.optr{width:15px;height:15px;border:1.5px solid var(--slate-300);border-radius:50%;flex-shrink:0}
.opt.on .optr{border-color:var(--blue-600);border-width:5px}
.optd{font-size:12px;color:var(--slate-500);line-height:1.45}
.opt-badge{font-family:var(--fm);font-size:9px;padding:2px 6px;border-radius:3px;background:var(--green-100);color:var(--green-700);font-weight:600;margin-left:auto}
.sel{padding:10px 13px;border:1px solid var(--slate-300);border-radius:5px;font-family:var(--fs);font-size:13.5px;background:#fff;outline:none;cursor:pointer;width:100%;max-width:420px}
.sel:focus{border-color:var(--blue-600)}
.leadcard{margin-top:13px;padding:13px 16px;background:var(--blue-50);border:1px solid #93C5FD;border-radius:5px;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center;animation:sl .25s ease}
.lav{width:38px;height:38px;border-radius:5px;background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.ln{font-size:14px;font-weight:600;color:var(--navy-900)}
.lm{font-size:12px;color:var(--slate-600);font-family:var(--fm)}
@keyframes sl{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dz{border:2px dashed var(--slate-300);border-radius:6px;padding:32px 26px;text-align:center;background:var(--slate-50);transition:.18s}
.dz.hover{border-color:var(--blue-600);background:var(--blue-50)}
.dz-ic{margin:0 auto 12px;width:44px;height:44px;border-radius:50%;background:var(--blue-100);display:flex;align-items:center;justify-content:center;color:var(--blue-600)}
.dz-t{font-size:15px;font-weight:600;color:var(--navy-900);margin-bottom:4px}
.dz-d{font-size:13px;color:var(--slate-500);margin-bottom:16px}
.dz-or{font-size:12px;color:var(--slate-400);margin-top:12px}
.fmt-row{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.fmt{font-family:var(--fm);font-size:10px;padding:4px 9px;background:#fff;border:1px solid var(--slate-200);color:var(--slate-500);border-radius:3px;font-weight:500}
.flist{margin-top:16px}
.flist-h{font-family:var(--fm);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-500);margin-bottom:9px;font-weight:600;display:flex;justify-content:space-between}
.frow{display:grid;grid-template-columns:34px 1fr auto auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--slate-200);border-radius:5px;margin-bottom:7px;background:#fff;animation:sl .25s ease}
.frow:hover{border-color:var(--slate-300);box-shadow:var(--sh)}
.fic{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:9px;font-weight:700;color:#fff}
.fic.pdf{background:#DC2626}.fic.doc{background:#2563EB}.fic.ppt{background:#EA580C}.fic.url{background:#0891B2}
.fname{font-size:13.5px;font-weight:500;color:var(--navy-900);word-break:break-all}
.fmeta{font-family:var(--fm);font-size:11px;color:var(--slate-400)}
.fsize{font-family:var(--fm);font-size:11.5px;color:var(--slate-500)}
.fdel{width:26px;height:26px;border:none;background:transparent;color:var(--slate-400);cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center}
.fdel:hover{background:var(--red-50);color:var(--red-700)}
.url-row{display:grid;grid-template-columns:1fr auto;gap:9px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:9px 18px;background:var(--slate-50);border-bottom:1px solid var(--slate-200);font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-500);font-weight:600}
table.dt td{padding:11px 18px;border-bottom:1px solid var(--slate-100);vertical-align:top}
table.dt tr:last-child td{border-bottom:none}
table.dt tbody tr:hover td{background:var(--slate-50)}
.mono{font-family:var(--fm);font-size:12px}.t-num{text-align:right;font-family:var(--fm)}
.sname{font-weight:600;color:var(--navy-900)}.stech{color:var(--slate-500);font-size:12px}
.adr{font-family:var(--fm);font-size:11px;color:var(--purple-700);background:var(--purple-100);padding:2px 7px;border-radius:3px;white-space:nowrap;font-weight:500}
.dl{display:grid;grid-template-columns:190px 1fr}
.dl dt{padding:10px 0;font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-500);border-bottom:1px solid var(--slate-100)}
.dl dd{padding:10px 0;border-bottom:1px solid var(--slate-100);color:var(--slate-900)}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--fm);font-size:10px;font-weight:600;padding:3.5px 8px;border-radius:3px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.p-red{background:var(--red-100);color:var(--red-700)}.p-amber{background:var(--amber-100);color:var(--amber-700)}
.p-green{background:var(--green-100);color:var(--green-700)}.p-blue{background:var(--sky-100);color:var(--sky-700)}
.p-grey{background:var(--slate-200);color:var(--slate-600)}
.btn{font-family:var(--fs);font-size:13.5px;font-weight:600;padding:10px 18px;border:none;border-radius:5px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-p{background:var(--blue-600);color:#fff;box-shadow:var(--sh)}
.btn-p:hover:not(:disabled){background:var(--navy-700);box-shadow:var(--sh-md)}
.btn-p:disabled{background:var(--slate-200);color:var(--slate-400);cursor:not-allowed;box-shadow:none}
.btn-g{background:#fff;color:var(--slate-700);border:1px solid var(--slate-300)}
.btn-g:hover:not(:disabled){border-color:var(--slate-400);background:var(--slate-50)}
.btn-sm{font-size:12px;padding:7px 13px;gap:6px}.btn-lg{font-size:14.5px;padding:12px 24px}
.btn-row{display:flex;gap:11px;align-items:center;margin-top:20px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--slate-500)}
.hint.err{color:var(--red-700);font-weight:500;display:flex;align-items:center;gap:6px}
.bn{padding:14px 18px;border-radius:6px;margin-bottom:16px;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;font-size:13.5px;border:1px solid}
.bn-ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:12px;font-weight:700;font-family:var(--fm)}
.bn-t{font-weight:600;margin-bottom:3px}.bn-b{line-height:1.55}
.b-red{background:var(--red-50);border-color:#FCA5A5}.b-red .bn-ic{background:var(--red-700)}.b-red .bn-t{color:var(--red-700)}.b-red .bn-b{color:#7F1D1D}
.b-amber{background:var(--amber-50);border-color:#FCD34D}.b-amber .bn-ic{background:var(--amber-700)}.b-amber .bn-t{color:var(--amber-700)}.b-amber .bn-b{color:#78350F}
.b-green{background:var(--green-50);border-color:#86EFAC}.b-green .bn-ic{background:var(--green-700)}.b-green .bn-t{color:var(--green-700)}.b-green .bn-b{color:#14532D}
.b-blue{background:var(--blue-50);border-color:#93C5FD}.b-blue .bn-ic{background:var(--blue-600)}.b-blue .bn-t{color:var(--navy-700)}.b-blue .bn-b{color:var(--slate-700)}
.sb{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:24px}
.ring{position:relative;width:124px;height:124px}
.rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rn{font-size:36px;font-weight:700;color:var(--navy-900);line-height:1}
.rd{font-family:var(--fm);font-size:10.5px;color:var(--slate-500);margin-top:2px}
.srow{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.sdesc{color:var(--slate-600);font-size:13.5px;max-width:460px}
.delta{font-family:var(--fm);font-size:11.5px;color:var(--green-700);font-weight:600}
.dim{display:grid;grid-template-columns:215px 1fr 54px;gap:14px;align-items:center;padding:9px 20px;font-size:13px;border-bottom:1px solid var(--slate-100)}
.dim:last-child{border-bottom:none}.dim:hover{background:var(--slate-50)}
.dn{color:var(--slate-700)}.dw{font-family:var(--fm);font-size:10px;color:var(--slate-400);margin-left:6px}
.dtr{height:7px;background:var(--slate-200);border-radius:4px;overflow:hidden}
.dfl{height:7px;border-radius:4px;transition:width .8s cubic-bezier(.34,1.2,.64,1)}
.ds{font-family:var(--fm);font-size:12px;text-align:right;color:var(--slate-700);font-weight:600}
.gfilter{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--slate-200);flex-wrap:wrap}
.gf{padding:5px 12px;font-size:12px;border-radius:20px;border:1px solid var(--slate-200);background:#fff;color:var(--slate-600);cursor:pointer;font-weight:500;transition:.15s;font-family:var(--fs)}
.gf:hover{border-color:var(--slate-400)}.gf.on{background:var(--navy-900);color:#fff;border-color:var(--navy-900)}
.gap{border-bottom:1px solid var(--slate-100);padding:15px 20px}
.gap:last-child{border-bottom:none}.gap:hover{background:var(--slate-50)}
.gap.res{background:var(--green-50)}
.gt{display:grid;grid-template-columns:88px 1fr auto;gap:14px;align-items:start}
.gtx{font-size:13.5px;color:var(--navy-900);font-weight:500;margin-bottom:3px}

function A(){return S.appKey?APPS[S.appKey]:null}
function lead(){if(!S.domain)return null;return S.domain==='__other'?OTHER_LEAD:DOMAINS[S.domain]}
function domainName(){return S.domain==='__other'?(S.domainOther||'Other'):S.domain}
function gaps(){const a=A();if(!a)return[];
let g=[...a.baseGaps];
const mf=S.migType?a.migFit[S.migType]:null;
if(mf&&mf.gap)g=[mf.gap,...g];
const b=(S.intakeAnswers.budget||'').toLowerCase();
if(b&&b.indexOf('approv')===-1)g=[{id:'g-budget',sev:'BLOCKER',text:'Budget approval is outstanding',
rem:'The Demand gate cannot close without approved funding. Obtain sign-off, or record an approved exception from the Domain Lead.',lift:9},...g];
return g.map(x=>({...x,status:S.resolutions[x.id]?'resolved':'open',resolution:S.resolutions[x.id]||''}))}
function ob(){return gaps().filter(g=>g.sev==='BLOCKER'&&g.status==='open')}
function dims(){const a=A();if(!a)return[];
const mf=S.migType?a.migFit[S.migType].s:5;
const bd=S.intakeAnswers.budget?((S.intakeAnswers.budget||'').toLowerCase().indexOf('approv')>-1?9:2):5;
return[a.baseDims[0],{n:'Migration type fit',w:3,s:mf},...a.baseDims.slice(1),{n:'Budget alignment',w:1,s:bd}]}
function rawScore(){const d=dims();if(!d.length)return 0;let n=0,dn=0;d.forEach(x=>{n+=x.s*x.w;dn+=x.w*10});return Math.round(n/dn*100)}
function score(){let b=rawScore();gaps().forEach(g=>{if(g.status==='resolved')b+=g.lift});return Math.min(b,100)}

:v>=60?{t:'CONDITIONALLY READY',c:'p-amber',d:'Proceed with conditions. High-severity gaps must close before the Design gate.'}
:{t:'NOT READY',c:'p-red',d:'Blockers must be resolved before this request can progress.'}}
function si(k){return STAGES.findIndex(s=>s.k===k)}

e.innerHTML='<span style="font-family:var(--fm);font-weight:700">'+(t==='ok'?'&#10003;':t==='err'?'!':'i')+'</span><span>'+m+'</span>';
document.getElementById('toasts').appendChild(e);
setTimeout(()=>{e.style.opacity='0';e.style.transition='.25s';setTimeout(()=>e.remove(),260)},3000)}

function phaseSteps(i){return STAGES.filter(s=>s.p===i)}
function goPhase(i){const st=phaseSteps(i);if(!st.length)return;
let t=st[0].k;st.forEach(s=>{if(S.done.has(s.k))t=s.k});go(t)}
function renderStepper(){
const o=ob().length;
const ci=si(S.stage);
const curKey=S.stage==='analysing'?'review':S.stage;
const cp=ci>=0?STAGES[ci].p:0;

document.getElementById('bands').innerHTML=BANDS.map((b,i)=>{
 const st=phaseSteps(i);
 const allDone=st.length>0&&st.every(s=>S.done.has(s.k));
 const isCur=i===cp;
 const blocked=isCur&&o>0&&BLOCKABLE.indexOf(curKey)>-1;
 let cls='ph',ic=String(b.ph),sub='';
 if(b.oos){cls+=' oos';sub='not in scope'}
 else if(blocked){cls+=' blk';ic='!';sub=o+' blocker'+(o>1?'s':'')}
 else if(isCur){cls+=' cur';
  const k=st.findIndex(s=>s.k===curKey);
  sub=((k>=0?k+1:st.filter(s=>S.done.has(s.k)).length+1))+' of '+st.length}
 else if(allDone){cls+=' done';ic='&#10003;';sub='complete'}
 else{sub=st.length+' step'+(st.length>1?'s':'')}

{k:['exception','waiver','override','bypass'],a:'<strong>Exceptions</strong><br><br>Where a blocker cannot be resolved conventionally, your Domain Lead can approve a formal exception. In the gap register, pick <strong>"Exception approved by Domain Lead"</strong> as the resolution type and record the justification.<br><br>This is a recorded decision on the audit trail, not a way around the control. Two common cases:<ul><li>Budget pending but delivery must start</li><li>Tableau required instead of Looker (ADR-BI-002-EX)</li></ul><span class="warn">Always get the exception agreed with your Domain Lead before recording it.</span>'},
{k:['discovery','what happens in discovery'],a:'<strong>Phase 3 &mdash; Discovery</strong><br><br>Two things must complete:<ul><li>The <strong>Application Discovery Questionnaire</strong></li><li>The <strong>data residency request</strong>, submitted by the ITAO through the <strong>DEx Tool</strong> and approved by the <strong>BAO</strong></li></ul>The phase ends when the <strong>DEV Landing Zone is provisioned</strong>.<br><br>Alongside this, the technical gaps from your readiness assessment are closed &mdash; SSIS inventory, dbt lineage, DAG mapping and so on.'},
{k:['design','ready to design','architecture design','target architecture'],a:'<strong>Ready to Design</strong> gives you the full target architecture — the layered diagram, every recommended GCP service with its configuration, and the ADR behind each choice.<br><br>The checklist covers what must be agreed before build starts: project and VPC, IAM model, BigQuery structure, connectivity, and the ADR sign-off.<span class="tip">Cloud Architecture — cloud.architecture@example.com — reviews the design.</span>'},
{k:['landing zone','vpc','project','environment'],a:'A <strong>landing zone</strong> is the pre-configured GCP project and network your application lands in, with guardrails already applied.<br><br>It is provisioned by SRE after the Design gate. For regulated data it is EU-region only, with VPC Service Controls around BigQuery, GCS and Composer.<span class="tip">Network Engineering — network.eng@example.com — for connectivity. Cloud Security — cloud.security@example.com — for the perimeter.</span>'},
{k:['dex','data exchange','residency','data residency'],a:'<strong>DEx Tool &mdash; Data Exchange Registry</strong><br><br>In Discovery, the <strong>ITAO</strong> submits a <strong>data residency request</strong> through the DEx Tool. The <strong>BAO (Business Application Owner)</strong> must approve it.<br><br>This gates LZ provisioning &mdash; the DEV Landing Zone is not provisioned until residency is approved.<span class="tip">Start this early. It is a common cause of delay because it needs a person outside your delivery team.</span>'},
{k:['itao','bao','roles','who is the itao'],a:()=>'<strong>Key roles</strong><div class="kv"><b>ITAO</b><span>IT Application Owner &mdash; raises the CR, submits the discovery questionnaire and the data residency request. That is you on this request.</span><b>BAO</b><span>Business Application Owner &mdash; approves the data residency request in the DEx Tool.</span><b>DOMAIN LEAD</b><span>'+(lead()?lead().lead:'assigned from your domain')+' &mdash; gives formal approval, attached to the CR.</span><b>DEMAND MGMT</b><span>Runs portfolio analysis, the tollgate, change control and story generation.</span><b>GROUP ARCH</b><span>Publishes the design guidelines the tollgate tests you against.</span></div>'},
{k:['heads up','heads-up','pre-discussion','informal','before raising'],a:()=>{const L=lead();
return '<strong>Informal heads-up</strong><br><br>Readiness Evaluation includes a pre-discussion with your Domain Lead so they are not seeing the CR cold. It is <strong>not</strong> the formal approval &mdash; that comes after the CR is raised.'+
(L?'<div class="kv"><b>WHO</b><span>'+L.lead+'</span><b>EMAIL</b><span>'+L.email+'</span></div>':'')+
'<span class="tip">There is a <strong>Send heads-up email</strong> button at the bottom of step 04 Recommendation that pre-fills a short summary.</span>'}},
{k:['cost center','cost centre','lz date','start date','template field'],a:()=>'<strong>CR template fields</strong><br><br>The Change Request carries these, most of them filled automatically:<div class="kv"><b>AUTO</b><span>NAR ID, App Name, Domain Name, R-Type, Domain Lead, ITAO</span><b>YOU ENTER</b><span>Cost Center, Start date, LZ date, Go-Live date, Budget status, Criticality</span><b>ATTACHED</b><span>Domain Lead approval, once received</span></div><br><strong>LZ date</strong> is when the DEV Landing Zone should be provisioned &mdash; it sits between your start date and go-live, and Demand Management checks it against provisioning capacity.'},
{k:['hello','hi ','hey','help','what can you'],a:'Hello. I can help with anything on this onboarding.<br><br>Common things people ask:<ul><li><em>Why am I blocked?</em> — I read your actual blockers and explain each one</li><li><em>Who do I contact?</em> — matched to your situation, not a generic list</li><li><em>Where am I?</em> — full status of your request</li><li><em>Explain the process</em> — the whole flow, end to end</li></ul>Ask in your own words. I will do my best to match it.'}];
